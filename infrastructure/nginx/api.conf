map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

upstream marketplace_api {
  # Socket.IO long-polling needs affinity; WebSocket upgrades are proxied below.
  ip_hash;
  server api:4000 max_fails=3 fail_timeout=10s;
  server api-secondary:4000 max_fails=3 fail_timeout=10s;
}

server {
  listen 80;
  server_name _;

  location / {
    proxy_pass http://marketplace_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
  }
}
