services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["marketplace_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    command: redis-server --appendonly yes
    volumes: ["marketplace_redis:/data"]
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: marketplace
      MINIO_ROOT_PASSWORD: marketplace-local-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["marketplace_minio:/data"]
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://marketplace:marketplace@postgres:5432/marketplace?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-compose-access-secret-change-me-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-compose-refresh-secret-change-me-32chars}
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:-local-compose-credential-secret-32chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: marketplace
      S3_ACCESS_KEY: marketplace
      S3_SECRET_KEY: marketplace-local-secret
      S3_FORCE_PATH_STYLE: "true"
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-local-sepay-secret}
      ALLOW_DEV_PAYMENT_SIMULATOR: ${ALLOW_DEV_PAYMENT_SIMULATOR:-true}
      SHIPPING_PROVIDER: LOCAL
      SHIPPING_WEBHOOK_SECRET: ${SHIPPING_WEBHOOK_SECRET:-local-shipping-secret}
      KYC_PROVIDER: LOCAL
      KYC_WEBHOOK_SECRET: ${KYC_WEBHOOK_SECRET:-local-kyc-secret}
    ports: ["${API_PORT:-4000}:4000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://marketplace:marketplace@postgres:5432/marketplace?schema=public
      REDIS_URL: redis://redis:6379
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:-local-compose-credential-secret-32chars}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@marketplace.local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
volumes:
  marketplace_postgres:
  marketplace_redis:
  marketplace_minio:
